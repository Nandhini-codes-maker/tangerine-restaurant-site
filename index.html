<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7ef">
  <meta name="description" content="A coastal Tamil kitchen serving fresh catch, slow masalas and warm rice.">
  <title>Tangerine — Coastal Tamil Kitchen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #fbf7ef;
      --white: #fffdf9;
      --ink: #27231d;
      --muted: #777269;
      --orange: #d85b28;
      --orange-dark: #a8431b;
      --peach: #f5e7d9;
      --green: #425b42;
      --line: #e9e0d3;
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", Arial, sans-serif;
      font-family: var(--sans);
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--paper); font-size: 16px; }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid #e79562; outline-offset: 3px;
    }
    .wrap { width: min(1120px, calc(100% - 48px)); margin-inline: auto; }
    .topbar { position: sticky; z-index: 5; top: 0; border-bottom: 1px solid rgb(39 35 29 / 8%); background: rgb(251 247 239 / 94%); backdrop-filter: blur(14px); }
    .nav { min-height: 82px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { text-decoration: none; font-family: var(--serif); font-size: 26px; font-weight: 700; letter-spacing: -.8px; }
    .brand span { color: var(--orange); }
    .nav-links { display: flex; align-items: center; gap: 32px; }
    .nav-links a { color: #625c53; text-decoration: none; font-size: 14px; font-weight: 600; transition: color .2s; }
    .nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--orange); }
    .nav-links .nav-cta { padding: 12px 19px; color: white; border-radius: 4px; background: var(--orange); }
    .nav-links .nav-cta:hover, .button:hover { color: white; background: var(--orange-dark); }
    main { min-height: 65vh; }
    .screen { animation: arrive .35s ease both; }
    @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .hero { min-height: 585px; padding-block: 65px; display: grid; align-items: center; grid-template-columns: 1.04fr .96fr; gap: 34px; }
    .eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 19px; color: var(--orange); font-size: 11px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; }
    .eyebrow::before { width: 25px; height: 1px; background: currentColor; content: ""; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: var(--serif); font-weight: 500; }
    h1 { max-width: 610px; margin-bottom: 22px; font-size: clamp(45px, 6.1vw, 76px); line-height: 1.06; letter-spacing: -2.4px; }
    h1 em { color: var(--orange); font-weight: 500; }
    .hero-copy { max-width: 480px; margin-bottom: 30px; color: var(--muted); font-size: 17px; line-height: 1.85; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .button { display: inline-flex; min-height: 49px; align-items: center; justify-content: center; padding: 0 22px; border: 0; border-radius: 4px; color: #fff; background: var(--orange); cursor: pointer; font-size: 14px; font-weight: 700; text-decoration: none; transition: background .2s, transform .2s; }
    .button:hover { transform: translateY(-1px); }
    .text-link { color: var(--ink); font-size: 14px; font-weight: 700; text-decoration-color: var(--orange); text-underline-offset: 5px; }
    .hero-art { position: relative; min-height: 435px; display: grid; place-items: center; }
    .art-halo { position: absolute; width: min(88%, 420px); aspect-ratio: 1; border-radius: 50%; background: #f1e1ce; }
    .hero-illustration { position: relative; z-index: 1; display: block; width: min(100%, 500px); height: auto; animation: hover 6s ease-in-out infinite; }
    @keyframes hover { 50% { transform: translateY(-8px) rotate(-1deg); } }
    .qualities { display: grid; grid-template-columns: repeat(3, 1fr); padding-block: 28px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .quality { padding-inline: 28px; border-right: 1px solid var(--line); }
    .quality:first-child { padding-left: 0; }
    .quality:last-child { border: 0; }
    .quality strong { display: block; margin-bottom: 5px; font-family: var(--serif); font-size: 18px; font-weight: 500; }
    .quality span { color: var(--muted); font-size: 13px; }
    .section { padding-block: 76px; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 27px; }
    .section-heading h2, .page-heading h1 { margin: 0; font-size: clamp(34px, 5vw, 52px); letter-spacing: -1px; }
    .section-heading p { margin: 0 0 5px; color: var(--muted); font-size: 14px; }
    .feature-grid, .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .dish-card { overflow: hidden; border: 1px solid var(--line); background: var(--white); }
    .dish-art { position: relative; min-height: 190px; overflow: hidden; background: #efe3d3; }
    .dish-art img { width: 100%; height: 210px; display: block; object-fit: cover; transition: transform .35s ease; }
    .dish-card:hover .dish-art img { transform: scale(1.045); }
    .dish-content { padding: 19px 20px 20px; }
    .dish-title-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .dish-title-line h3 { margin: 0; font-size: 19px; }
    .dish-price { flex: none; color: var(--orange); font-size: 14px; font-weight: 700; }
    .dish-content p { min-height: 42px; margin: 9px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .veg-label { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; color: var(--green); font-size: 11px; font-weight: 700; }
    .veg-label::before { width: 9px; height: 9px; border: 1px solid var(--green); border-radius: 50%; background: var(--green); box-shadow: inset 0 0 0 2px white; content: ""; }
    .callout { padding: 43px 48px; display: flex; align-items: center; justify-content: space-between; gap: 26px; color: white; background: var(--green); }
    .callout h2 { margin: 0 0 7px; font-size: 32px; }
    .callout p { margin: 0; color: rgb(255 255 255 / 78%); font-size: 14px; }
    .button-light { flex: none; color: var(--ink); background: #fffaf1; }
    .button-light:hover { color: var(--ink); background: white; }
    .page-heading { padding-block: 65px 34px; }
    .page-heading .eyebrow { margin-bottom: 12px; }
    .page-heading p { max-width: 610px; margin: 14px 0 0; color: var(--muted); font-size: 16px; line-height: 1.8; }
    .menu-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 25px; }
    .filters { display: flex; flex-wrap: wrap; gap: 9px; }
    .filter { padding: 9px 15px; border: 1px solid var(--line); border-radius: 30px; color: var(--muted); background: transparent; cursor: pointer; font-size: 13px; font-weight: 600; }
    .filter[aria-pressed="true"] { border-color: var(--ink); color: white; background: var(--ink); }
    .search { width: min(100%, 260px); min-height: 42px; padding: 0 13px; border: 1px solid var(--line); border-radius: 4px; background: var(--white); }
    .menu-grid { padding-bottom: 76px; }
    .menu-grid .dish-card[hidden] { display: none; }
    .form-layout { padding-bottom: 76px; display: grid; grid-template-columns: .8fr 1.2fr; align-items: start; gap: 54px; }
    .visit-card { padding: 27px; color: white; background: var(--green); }
    .visit-card h2 { margin: 0 0 17px; font-size: 28px; }
    .visit-card p { margin: 0 0 19px; color: rgb(255 255 255 / 78%); font-size: 14px; line-height: 1.8; }
    .visit-card p:last-child { margin-bottom: 0; }
    .visit-card strong { color: white; }
    .booking-form { padding: 28px; border: 1px solid var(--line); background: var(--white); }
    .booking-form h2 { margin: 0 0 6px; font-size: 27px; }
    .form-intro { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    .booking-form .button { width: 100%; margin-top: 18px; }
    .story-grid { padding-bottom: 76px; display: grid; grid-template-columns: 1fr 1fr; gap: 42px; align-items: center; }
    .story-art { min-height: 340px; display: grid; place-items: center; background: radial-gradient(circle at center, #f5e6d5 0 44%, transparent 45%), linear-gradient(140deg, #e9e2d3, #d7ddc8); }
    .story-photo { width: min(78%, 320px); aspect-ratio: 1; border: 9px solid var(--white); border-radius: 50%; object-fit: cover; box-shadow: 0 18px 25px rgb(39 35 29 / 16%); }
    .story-copy h2 { margin-bottom: 17px; font-size: 36px; }
    .story-copy p { color: var(--muted); font-size: 14px; line-height: 1.9; }
    .contact-layout { padding-bottom: 76px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .contact-card { min-height: 210px; padding: 28px; border: 1px solid var(--line); background: var(--white); }
    .contact-card h2 { margin-bottom: 12px; font-size: 25px; }
    .contact-card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.9; }
    .sample-note { margin-top: 16px !important; color: var(--orange) !important; font-size: 12px !important; }
    .empty-state { grid-column: 1 / -1; padding: 32px; border: 1px dashed var(--line); color: var(--muted); text-align: center; }
    .loading { padding: 34px; color: var(--muted); }
    .footer { margin-top: 20px; color: #eee8dc; background: #282820; }
    .footer-inner { min-height: 85px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .footer p { margin: 0; color: #c7c1b5; font-size: 12px; }
    .footer a { color: white; font-size: 12px; text-decoration: none; }
    @media (max-width: 760px) {
      .wrap { width: min(100% - 34px, 560px); }
      .nav { min-height: 70px; flex-wrap: wrap; gap: 12px; padding-block: 10px; }
      .brand { font-size: 23px; }
      .nav-links { justify-content: space-between; order: 2; width: 100%; gap: 10px; }
      .nav-links a { font-size: 12px; }
      .nav-links .nav-cta { padding: 9px 13px; }
      .hero { min-height: auto; padding-block: 54px 35px; grid-template-columns: 1fr; gap: 0; }
      h1 { font-size: clamp(45px, 12vw, 65px); }
      .hero-copy { font-size: 15px; }
      .hero-art { min-height: 330px; }
      .hero-illustration { width: min(100%, 470px); }
      .qualities { gap: 15px; }
      .quality { padding-inline: 12px; }
      .quality strong { font-size: 15px; }
      .quality span { font-size: 11px; line-height: 1.5; display: block; }
      .section { padding-block: 55px; }
      .feature-grid, .menu-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .dish-art { min-height: 120px; }
      .dish-art img { height: 145px; }
      .dish-content { padding: 14px; }
      .dish-title-line { display: block; }
      .dish-title-line h3 { font-size: 17px; }
      .dish-price { display: block; margin-top: 5px; }
      .dish-content p { min-height: 0; font-size: 12px; }
      .callout { padding: 30px 24px; align-items: flex-start; flex-direction: column; }
      .form-layout, .story-grid { grid-template-columns: 1fr; gap: 23px; }
      .story-art { min-height: 260px; }
      .contact-layout { grid-template-columns: 1fr; }
      .page-heading { padding-top: 45px; }
      .menu-grid { padding-bottom: 55px; }
      .form-layout, .story-grid, .contact-layout { padding-bottom: 55px; }
      .footer-inner { padding-block: 22px; align-items: flex-start; flex-direction: column; justify-content: center; }
    }
    @media (max-width: 410px) {
      .nav-links { gap: 7px; }
      .nav-links a { font-size: 11px; }
      .nav-links .nav-cta { padding: 8px 10px; }
      .feature-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="nav wrap" aria-label="Main navigation">
      <a class="brand" href="#/home" aria-label="Tangerine home">Tangerine<span>.</span></a>
      <div class="nav-links">
        <a href="#/home" data-nav="home">Home</a>
        <a href="#/menu" data-nav="menu">Menu</a>
        <a href="#/story" data-nav="story">Our story</a>
        <a href="#/contact" data-nav="contact">Contact</a>
        <a class="nav-cta" href="#/reserve" data-nav="reserve">Reserve a table</a>
      </div>
    </nav>
  </header>
  <main id="app" tabindex="-1"><p class="loading wrap">Preparing something good…</p></main>
  <footer class="footer">
    <div class="footer-inner wrap">
      <a class="brand" href="#/home">Tangerine<span>.</span></a>
      <p>Coastal Tamil cooking, made with care.</p>
      <a href="#/reserve">Plan your visit <span aria-hidden="true">→</span></a>
    </div>
  </footer>
  <script>
    const app = document.getElementById("app");
    const routes = ["home", "menu", "story", "reserve", "contact"];
    const menuItems = [
      { name: "Nethili fry", description: "Crisp anchovies, curry leaf, black pepper", price_paise: 32000, category: "starters", vegetarian: 0, featured: 1 },
      { name: "Crab milagu masala", description: "Pepper-roasted crab, shallots", price_paise: 54000, category: "starters", vegetarian: 0, featured: 0 },
      { name: "Vazhaipoo vadai", description: "Banana flower fritters, mint chutney", price_paise: 24000, category: "starters", vegetarian: 1, featured: 0 },
      { name: "Kola urundai", description: "Spiced lamb croquettes, lime", price_paise: 38000, category: "starters", vegetarian: 0, featured: 0 },
      { name: "Meen kuzhambu", description: "Tamarind fish curry, ginger, fenugreek", price_paise: 52000, category: "mains", vegetarian: 0, featured: 1 },
      { name: "Prawn thokku", description: "Slow-cooked masala, kuzhi paniyaram", price_paise: 64000, category: "mains", vegetarian: 0, featured: 0 },
      { name: "Kothu parotta", description: "Shredded parotta, egg, salna", price_paise: 36000, category: "mains", vegetarian: 0, featured: 0 },
      { name: "Keerai kootu meal", description: "Greens, lentils, rice, rasam, poriyal", price_paise: 42000, category: "mains", vegetarian: 1, featured: 0 },
      { name: "Elaneer payasam", description: "Tender coconut, jaggery, cardamom", price_paise: 22000, category: "sweets", vegetarian: 1, featured: 1 },
      { name: "Kesari", description: "Semolina, saffron, ghee, cashew", price_paise: 18000, category: "sweets", vegetarian: 1, featured: 0 },
      { name: "Palm jaggery kulfi", description: "Slow-set, toasted sesame", price_paise: 24000, category: "sweets", vegetarian: 1, featured: 0 }
    ];

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function formatPrice(paise) {
      return new Intl.NumberFormat("en-IN", {
        style: "currency", currency: "INR", maximumFractionDigits: 0
      }).format(paise / 100);
    }

    const dishPhotos = {
      "Nethili fry": "assets/nethili-fry.jpg",
      "Crab milagu masala": "assets/crab-milagu-masala.jpg",
      "Vazhaipoo vadai": "assets/vazhaipoo-vadai.jpg",
      "Kola urundai": "assets/kola-urundai.jpg",
      "Meen kuzhambu": "assets/meen-kuzhambu.jpg",
      "Prawn thokku": "assets/prawn-thokku.jpg",
      "Kothu parotta": "assets/kothu-parotta.jpg",
      "Keerai kootu meal": "assets/keerai-kootu-meal.jpg",
      "Elaneer payasam": "assets/elaneer-payasam.jpg",
      "Kesari": "assets/kesari.jpg",
      "Palm jaggery kulfi": "assets/palm-jaggery-kulfi.jpg"
    };

    function dishImage(item) {
      return dishPhotos[item.name] || "assets/meen-kuzhambu.jpg";
    }

    function dishCard(item) {
      return `<article class="dish-card">
        <div class="dish-art"><img src="${dishImage(item)}" alt="" loading="lazy"></div>
        <div class="dish-content">
          <div class="dish-title-line"><h3>${escapeHTML(item.name)}</h3><span class="dish-price">${formatPrice(item.price_paise)}</span></div>
          <p>${escapeHTML(item.description)}</p>
          ${item.vegetarian ? '<span class="veg-label">Vegetarian</span>' : ""}
        </div>
      </article>`;
    }

    function pageHeading(eyebrow, title, description) {
      return `<header class="page-heading wrap"><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p>${description}</p></header>`;
    }

    function renderHome() {
      const featured = menuItems.filter(item => item.featured).slice(0, 3);
      app.innerHTML = `<div class="screen">
        <section class="hero wrap">
          <div>
            <p class="eyebrow">A taste of the Tamil coast</p>
            <h1>Fresh fish.<br>Slow masalas.<br><em>Warm rice.</em></h1>
            <p class="hero-copy">A little warmth from the coast. We cook with the catch of the day, masalas ground in house, and recipes that feel like coming home.</p>
            <div class="actions"><a class="button" href="#/reserve">Book a table</a><a class="text-link" href="#/menu">Explore our menu&nbsp; ↗</a></div>
          </div>
          <div class="hero-art">
            <img class="hero-illustration" src="assets/hero-illustration.png" alt="Illustrated bowl of coastal curry with fresh-catch and slow-cooked labels" fetchpriority="high">
          </div>
        </section>
        <section class="qualities wrap" aria-label="What makes us special">
          <div class="quality"><strong>Caught that morning</strong><span>Fresh catch, brought in from local waters.</span></div>
          <div class="quality"><strong>Ground in house</strong><span>Our masalas are roasted and ground with care.</span></div>
          <div class="quality"><strong>Made to be shared</strong><span>Big-hearted plates and a seat for everyone.</span></div>
        </section>
        <section class="section wrap">
          <div class="section-heading"><div><p class="eyebrow">A few favourites</p><h2>From our kitchen</h2></div><a class="text-link" href="#/menu">See the full menu&nbsp; ↗</a></div>
          <div class="feature-grid">${featured.map(dishCard).join("")}</div>
        </section>
        <section class="callout wrap"><div><h2>Come hungry. Leave happy.</h2><p>Good food, good company, and a table waiting for you.</p></div><a class="button button-light" href="#/reserve">Save your seat&nbsp; →</a></section>
      </div>`;
    }

    function renderMenu() {
      app.innerHTML = `<div class="screen">
        ${pageHeading("Cooked with care", "A menu from the coast", "Fresh catch, slow-cooked favourites and a little something sweet. Every dish is made to bring people together.")}
        <section class="wrap">
          <div class="menu-toolbar">
            <div class="filters" role="group" aria-label="Filter menu by category">
              <button class="filter" type="button" data-category="all" aria-pressed="true">All plates</button>
              <button class="filter" type="button" data-category="starters" aria-pressed="false">Starters</button>
              <button class="filter" type="button" data-category="mains" aria-pressed="false">Mains</button>
              <button class="filter" type="button" data-category="sweets" aria-pressed="false">Sweets</button>
            </div>
            <label><span class="sr-only"></span><input class="search" type="search" placeholder="Find a favourite…" aria-label="Search menu"></label>
          </div>
          <div class="menu-grid">${menuItems.map(item => `<div data-menu-category="${item.category}" data-menu-name="${escapeHTML(item.name.toLowerCase())}">${dishCard(item)}</div>`).join("")}</div>
          <div class="callout" style="margin-bottom:70px"><div><h2>Found your favourite?</h2><p>We’d love to have you in for a meal.</p></div><a class="button button-light" href="#/reserve">Reserve a table&nbsp; →</a></div>
        </section>
      </div>`;
      const filters = [...app.querySelectorAll(".filter")];
      const search = app.querySelector(".search");
      function filterMenu() {
        const active = app.querySelector('.filter[aria-pressed="true"]').dataset.category;
        const query = search.value.trim().toLowerCase();
        let visible = 0;
        app.querySelectorAll("[data-menu-category]").forEach(card => {
          const show = (active === "all" || card.dataset.menuCategory === active) && card.dataset.menuName.includes(query);
          card.hidden = !show;
          if (show) visible++;
        });
        const grid = app.querySelector(".menu-grid");
        const noResults = app.querySelector(".no-results");
        if (!visible && !noResults) grid.insertAdjacentHTML("beforeend", '<p class="empty-state no-results">No dishes match that search. Try another name.</p>');
        if (visible && noResults) noResults.remove();
      }
      filters.forEach(button => button.addEventListener("click", () => {
        filters.forEach(filter => filter.setAttribute("aria-pressed", String(filter === button)));
        filterMenu();
      }));
      search.addEventListener("input", filterMenu);
    }

    function renderReservation() {
      app.innerHTML = `<div class="screen">
        ${pageHeading("We’ll save you a seat", "Make it a meal to remember", "Call us to arrange your visit.")}
        <section class="form-layout wrap">
          <aside class="visit-card">
            <h2>A little note</h2>
            <p>We welcome parties of one to six. For larger gatherings, get in touch and we’ll do our best to find a spot for everyone.</p>
            <p><strong>Lunch</strong><br>Tuesday–Sunday · 12:00–15:00</p>
            <p><strong>Dinner</strong><br>Tuesday–Friday · 18:30–22:30<br>Saturday–Sunday · 12:00–23:00</p>
            <p><strong>Closed Mondays</strong><br>We’ll be back at the table on Tuesday.</p>
          </aside>
          <div class="booking-form">
            <p class="eyebrow">Reservations</p>
            <h2>Let’s plan your visit.</h2>
            <p class="form-intro">This static website doesn’t send or store reservation requests. Please call us to book your table.</p>
            <p><strong>Phone</strong><br><a href="tel:+910000000000">+91 00000 00000</a></p>
            <p class="sample-note">Sample phone number — replace with your restaurant’s number before publishing.</p>
            <a class="button" href="tel:+910000000000">Call to reserve</a>
          </div>
        </section>
      </div>`;
    }

    function renderStory() {
      app.innerHTML = `<div class="screen">
        ${pageHeading("Our roots, our table", "A little bit of the coast", "Tangerine is inspired by the generous kitchens and big flavours of Tamil Nadu’s coastline.")}
        <section class="story-grid wrap">
          <div class="story-art"><img class="story-photo" src="assets/story-catch.jpg" alt="Fresh fish and shellfish laid out over ice" loading="lazy"></div>
          <div class="story-copy"><p class="eyebrow">From our kitchen</p><h2>Recipes with a sense of home.</h2>
            <p>Some meals begin with the catch brought in at first light. Others begin with a pan of spices, slowly toasted until the whole kitchen smells of home. We bring those moments to the table every day.</p>
            <p>Our cooking is rooted in the flavours of coastal Tamil Nadu: bright tamarind, fragrant curry leaves, and masalas ground in small batches. The best part is still sharing it with you.</p>
            <a class="button" href="#/menu">Take a look at the menu</a>
          </div>
        </section>
        <section class="callout wrap"><div><h2>There’s always room at our table.</h2><p>Bring your appetite and someone you love.</p></div><a class="button button-light" href="#/reserve">Come visit us&nbsp; →</a></section>
      </div>`;
    }

    function renderContact() {
      app.innerHTML = `<div class="screen">
        ${pageHeading("Come on in", "We’d love to see you", "Make an evening of it, stop by for lunch, or save your seat ahead of time.")}
        <section class="contact-layout wrap">
          <article class="contact-card"><p class="eyebrow">Find us</p><h2>At the table</h2><p>14 Lighthouse Road<br>Your City 600000</p><p class="sample-note">Sample address — update with your restaurant’s details before publishing.</p></article>
          <article class="contact-card"><p class="eyebrow">Drop by</p><h2>Kitchen hours</h2><p>Tuesday–Friday<br>12:00–15:00 · 18:30–22:30<br><br>Saturday–Sunday<br>12:00–23:00<br><br>Monday · Closed</p></article>
          <article class="contact-card"><p class="eyebrow">Give us a ring</p><h2>Let’s talk</h2><p><a href="tel:+910000000000">+91 00000 00000</a></p><p class="sample-note">Sample phone number — replace before publishing.</p></article>
          <article class="contact-card"><p class="eyebrow">Planning ahead?</p><h2>Your seat is waiting</h2><p>Call us directly to arrange your table.</p><p style="margin-top:18px"><a class="text-link" href="#/reserve">Reservation details&nbsp; →</a></p></article>
        </section>
      </div>`;
    }

    const renderers = { home: renderHome, menu: renderMenu, story: renderStory, reserve: renderReservation, contact: renderContact };

    function renderRoute() {
      const route = location.hash.replace(/^#\/?/, "") || "home";
      const selected = routes.includes(route) ? route : "home";
      renderers[selected]();
      document.querySelectorAll("[data-nav]").forEach(link => {
        if (link.dataset.nav === selected) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });
      window.scrollTo(0, 0);
    }

    window.addEventListener("hashchange", renderRoute);
    renderRoute();
  </script>
</body>
</html>
